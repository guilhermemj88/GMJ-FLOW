services:
  preview:
    image: nginx:1.27-alpine
    container_name: gmj-flow-preview
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gmj-flow_default

networks:
  gmj-flow_default:
    external: true
