server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # EXCEÇÕES DE ESCRITA AUTORIZADAS — somente POST com semântica de leitura.
    # Cada exceção é uma location exata/única, sem liberar namespace inteiro.
    # ------------------------------------------------------------------

    # Login (obtenção de JWT). Não há cookies; o token é devolvido no corpo.
    location = /api/auth/login {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        add_header Allow "POST, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/login {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        add_header Allow "POST, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consultas de widget do Dashboard (leitura via POST, confirmado sem persistência).
    location = /api/dashboard-widgets/query {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        add_header Allow "POST, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/dashboard-widgets/preview {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        add_header Allow "POST, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/dashboards/[0-9]+/widgets/[0-9]+/query$ {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        add_header Allow "POST, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # GRAFANA: namespace totalmente bloqueado na preview (sem proxy).
    # ------------------------------------------------------------------
    location ^~ /api/v1/grafana {
        return 404;
    }

    # ------------------------------------------------------------------
    # /api/ genérico: DEFAULT DENY para escrita. GET/HEAD/OPTIONS liberados.
    # ------------------------------------------------------------------
    location /api/ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        add_header Allow "GET, HEAD, OPTIONS" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
