services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: gmj-flow-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE-flowdb}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d/gmj-log-retention.xml:/etc/clickhouse-server/config.d/gmj-log-retention.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: gmj-flow-backend
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE-flowdb}
      CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: "${CLICKHOUSE_CONNECT_TIMEOUT_SECONDS-5}"
      CLICKHOUSE_QUERY_TIMEOUT_SECONDS: "${CLICKHOUSE_QUERY_TIMEOUT_SECONDS-30}"
      CLICKHOUSE_ADMIN_TIMEOUT_SECONDS: "${CLICKHOUSE_ADMIN_TIMEOUT_SECONDS-300}"
      API_CORS_ORIGINS: "${API_CORS_ORIGINS-}"
      GMJFLOW_HOST_AGENT_URL: "${GMJFLOW_HOST_AGENT_URL-}"
      GMJFLOW_HOST_AGENT_TOKEN: "${GMJFLOW_HOST_AGENT_TOKEN-}"
      GMJFLOW_DB_PATH: "${GMJFLOW_DB_PATH-/app/data/gmjflow.db}"
      GMJFLOW_SAFE_SHADOW_AUDIT_ELIGIBLE_SAMPLE_RATE: "${GMJFLOW_SAFE_SHADOW_AUDIT_ELIGIBLE_SAMPLE_RATE-1000}"
      GMJFLOW_SAFE_MAD_ABSOLUTE_FLOOR_PPS: "${GMJFLOW_SAFE_MAD_ABSOLUTE_FLOOR_PPS-0.5}"
      GMJFLOW_SAFE_MAD_RELATIVE_FLOOR_RATIO: "${GMJFLOW_SAFE_MAD_RELATIVE_FLOOR_RATIO-0.05}"
      GMJFLOW_AUTH_SECRET: "${GMJFLOW_AUTH_SECRET-gmj-flow-dev-secret-change-me}"
      GMJFLOW_AI_CREDENTIAL_KEY: "${GMJFLOW_AI_CREDENTIAL_KEY-}"
      GMJFLOW_RUNTIME_DIR: "${GMJFLOW_RUNTIME_DIR-/app/runtime}"
      GMJFLOW_PROJECT_DIR: "${GMJFLOW_PROJECT_DIR-}"
      GMJFLOW_DOCKER_NETWORK: "${GMJFLOW_DOCKER_NETWORK-gmj-flow_default}"
      GMJFLOW_COLLECTORS_DIR: "${GMJFLOW_COLLECTORS_DIR-}"
      GMJFLOW_COLLECTOR_APPLY_SCRIPT: "${GMJFLOW_COLLECTOR_APPLY_SCRIPT-/app/runtime/scripts/apply_collectors.sh}"
      GMJFLOW_ENABLE_COLLECTOR_APPLY: "${GMJFLOW_ENABLE_COLLECTOR_APPLY-false}"
      GMJFLOW_SNMP_POLLING_ENABLED: "${GMJFLOW_SNMP_POLLING_ENABLED-1}"
      GMJFLOW_CALIBRATION_MIN_BPS: "${GMJFLOW_CALIBRATION_MIN_BPS-10000}"
      GMJFLOW_CALIBRATION_MIN_CONFIDENCE: "${GMJFLOW_CALIBRATION_MIN_CONFIDENCE-0.6}"
      GMJFLOW_MAX_RANGE_MINUTES: "${GMJFLOW_MAX_RANGE_MINUTES-259200}"
      GMJFLOW_ANOMALY_DETECTION_ENABLED: "${GMJFLOW_ANOMALY_DETECTION_ENABLED-true}"
      GMJFLOW_ANOMALY_INTERVAL_SECONDS: "${GMJFLOW_ANOMALY_INTERVAL_SECONDS-30}"
      GMJFLOW_BGP_STATUS_CHECK_TIMEOUT_SECONDS: "${GMJFLOW_BGP_STATUS_CHECK_TIMEOUT_SECONDS-45}"
      GMJFLOW_BGP_STATUS_CHECK_WORKERS: "${GMJFLOW_BGP_STATUS_CHECK_WORKERS-4}"
      GMJFLOW_ANOMALY_LOOKBACK_SECONDS: "${GMJFLOW_ANOMALY_LOOKBACK_SECONDS-60}"
      GMJFLOW_ANOMALY_MIN_DURATION_SECONDS: "${GMJFLOW_ANOMALY_MIN_DURATION_SECONDS-30}"
      GMJFLOW_ANOMALY_CLOSE_AFTER_SECONDS: "${GMJFLOW_ANOMALY_CLOSE_AFTER_SECONDS-120}"
      GMJFLOW_ANOMALY_MITIGATION_RETRY_WINDOW_SECONDS: "${GMJFLOW_ANOMALY_MITIGATION_RETRY_WINDOW_SECONDS-900}"
      GMJFLOW_BGP_AUTO_CHECK_ENABLED: "${GMJFLOW_BGP_AUTO_CHECK_ENABLED-true}"
      GMJFLOW_BGP_CHECK_INTERVAL_SECONDS: "${GMJFLOW_BGP_CHECK_INTERVAL_SECONDS-30}"
      GMJFLOW_ASN_RESOLVER_ENABLED: "${GMJFLOW_ASN_RESOLVER_ENABLED-true}"
      GMJFLOW_ASN_RESOLVER_BATCH_SIZE: "${GMJFLOW_ASN_RESOLVER_BATCH_SIZE-20}"
      GMJFLOW_ASN_RESOLVER_INTERVAL_SECONDS: "${GMJFLOW_ASN_RESOLVER_INTERVAL_SECONDS-30}"
      GMJFLOW_ASN_RESOLVER_TIMEOUT_SECONDS: "${GMJFLOW_ASN_RESOLVER_TIMEOUT_SECONDS-10}"
      GMJFLOW_ASN_RESOLVER_MAX_ATTEMPTS: "${GMJFLOW_ASN_RESOLVER_MAX_ATTEMPTS-3}"
      GMJFLOW_ASN_CACHE_TTL_DAYS: "${GMJFLOW_ASN_CACHE_TTL_DAYS-30}"
      GMJFLOW_GEOIP_MMDB_PATH: "${GMJFLOW_GEOIP_MMDB_PATH-/app/data/GeoLite2-City.mmdb}"
      GMJFLOW_THREAT_INTEL_SCHEDULER_ENABLED: "${GMJFLOW_THREAT_INTEL_SCHEDULER_ENABLED-true}"
      GMJFLOW_THREAT_INTEL_INITIAL_DELAY_SECONDS: "${GMJFLOW_THREAT_INTEL_INITIAL_DELAY_SECONDS-15}"
      GMJFLOW_THREAT_INTEL_HTTP_TIMEOUT_SECONDS: "${GMJFLOW_THREAT_INTEL_HTTP_TIMEOUT_SECONDS-30}"
      GMJFLOW_THREAT_INTEL_GREYNOISE_ENABLED: "${GMJFLOW_THREAT_INTEL_GREYNOISE_ENABLED-false}"
      GMJFLOW_THREAT_INTEL_GREYNOISE_INTERVAL_SECONDS: "${GMJFLOW_THREAT_INTEL_GREYNOISE_INTERVAL_SECONDS-28800}"
      GREYNOISE_API_KEY: "${GREYNOISE_API_KEY-}"
      GREYNOISE_GNQL_URL: "${GREYNOISE_GNQL_URL-https://api.greynoise.io/v3/gnql}"
      GMJFLOW_THREAT_INTEL_CEREAL2_ENABLED: "${GMJFLOW_THREAT_INTEL_CEREAL2_ENABLED-true}"
      GMJFLOW_THREAT_INTEL_CEREAL2_INTERVAL_SECONDS: "${GMJFLOW_THREAT_INTEL_CEREAL2_INTERVAL_SECONDS-900}"
      CEREAL2_BASE_URL: "${CEREAL2_BASE_URL-https://cereal2.botnet.cl}"
      GMJFLOW_CEREAL2_ATTACK_PAGE_SIZE: "${GMJFLOW_CEREAL2_ATTACK_PAGE_SIZE-200}"
      GMJFLOW_CEREAL2_ATTACK_MAX_PAGES: "${GMJFLOW_CEREAL2_ATTACK_MAX_PAGES-20}"
      GMJFLOW_CEREAL2_ATTACK_RETENTION_DAYS: "${GMJFLOW_CEREAL2_ATTACK_RETENTION_DAYS-30}"
      GMJFLOW_THREAT_INTEL_TEAM_CYMRU_ENABLED: "${GMJFLOW_THREAT_INTEL_TEAM_CYMRU_ENABLED-true}"
      GMJFLOW_THREAT_INTEL_TEAM_CYMRU_INTERVAL_SECONDS: "${GMJFLOW_THREAT_INTEL_TEAM_CYMRU_INTERVAL_SECONDS-14400}"
      GMJFLOW_THREAT_INTEL_FEODO_ENABLED: "${GMJFLOW_THREAT_INTEL_FEODO_ENABLED-true}"
      GMJFLOW_THREAT_INTEL_FEODO_INTERVAL_SECONDS: "${GMJFLOW_THREAT_INTEL_FEODO_INTERVAL_SECONDS-900}"
      FEODO_FEED_URL: "${FEODO_FEED_URL-https://feodotracker.abuse.ch/downloads/ipblocklist.json}"
      GMJFLOW_THREAT_INTEL_BLOCKLIST_DE_ENABLED: "${GMJFLOW_THREAT_INTEL_BLOCKLIST_DE_ENABLED-true}"
      GMJFLOW_THREAT_INTEL_BLOCKLIST_DE_INTERVAL_SECONDS: "${GMJFLOW_THREAT_INTEL_BLOCKLIST_DE_INTERVAL_SECONDS-900}"
      BLOCKLIST_DE_FEED_URL: "${BLOCKLIST_DE_FEED_URL-https://lists.blocklist.de/lists/all.txt}"
      GMJFLOW_BEHAVIORAL_DETECTION_ENABLED: "${GMJFLOW_BEHAVIORAL_DETECTION_ENABLED-true}"
      GMJFLOW_AUTO_MITIGATION_ENABLED: "${GMJFLOW_AUTO_MITIGATION_ENABLED-false}"
      GMJFLOW_AUTO_MITIGATION_KILL_SWITCH: "${GMJFLOW_AUTO_MITIGATION_KILL_SWITCH-false}"
      GMJFLOW_BEHAVIOR_INITIAL_DELAY_SECONDS: "${GMJFLOW_BEHAVIOR_INITIAL_DELAY_SECONDS-30}"
      GMJFLOW_BEHAVIOR_INTERVAL_SECONDS: "${GMJFLOW_BEHAVIOR_INTERVAL_SECONDS-30}"
      GMJFLOW_BEHAVIOR_LOOKBACK_SECONDS: "${GMJFLOW_BEHAVIOR_LOOKBACK_SECONDS-300}"
      GMJFLOW_BEHAVIOR_MAX_OBSERVATIONS: "${GMJFLOW_BEHAVIOR_MAX_OBSERVATIONS-100000}"
      GMJFLOW_BEHAVIOR_CANDIDATE_ENGINE_V2: "${GMJFLOW_BEHAVIOR_CANDIDATE_ENGINE_V2-false}"
      GMJFLOW_BEHAVIOR_MAX_PREFIX_GROUPS: "${GMJFLOW_BEHAVIOR_MAX_PREFIX_GROUPS-50000}"
      GMJFLOW_BEHAVIOR_MAX_INTEL_LOOKUPS_PER_VECTOR: "${GMJFLOW_BEHAVIOR_MAX_INTEL_LOOKUPS_PER_VECTOR-500}"
      GMJFLOW_BEHAVIOR_BASELINE_ALPHA: "${GMJFLOW_BEHAVIOR_BASELINE_ALPHA-0.1}"
      GMJFLOW_SECURITY_EVENT_RETENTION_DAYS: "${GMJFLOW_SECURITY_EVENT_RETENTION_DAYS-3}"
      GMJFLOW_SECURITY_EVENT_QUERY_MAX_SECONDS: "${GMJFLOW_SECURITY_EVENT_QUERY_MAX_SECONDS-21600}"
      GMJFLOW_SECURITY_AI_ENABLED: "${GMJFLOW_SECURITY_AI_ENABLED-false}"
      GMJFLOW_SECURITY_AI_KILL_SWITCH: "${GMJFLOW_SECURITY_AI_KILL_SWITCH-false}"
      GMJFLOW_SECURITY_AI_PROVIDER: "${GMJFLOW_SECURITY_AI_PROVIDER-groq}"
      GMJFLOW_SECURITY_AI_MODEL: "${GMJFLOW_SECURITY_AI_MODEL-}"
      GMJFLOW_SECURITY_AI_BASE_URL: "${GMJFLOW_SECURITY_AI_BASE_URL-}"
      GMJFLOW_SECURITY_AI_API_KEY: "${GMJFLOW_SECURITY_AI_API_KEY-}"
      GROQ_API_KEY: "${GROQ_API_KEY-}"
      GMJFLOW_SECURITY_AI_TIMEOUT_SECONDS: "${GMJFLOW_SECURITY_AI_TIMEOUT_SECONDS-30}"
      GMJFLOW_SECURITY_AI_MAX_PROMPT_CHARS: "${GMJFLOW_SECURITY_AI_MAX_PROMPT_CHARS-30000}"
      GMJFLOW_SECURITY_AI_MAX_OUTPUT_TOKENS: "${GMJFLOW_SECURITY_AI_MAX_OUTPUT_TOKENS-1600}"
      GMJFLOW_SCAN_VERTICAL_PORTS: "${GMJFLOW_SCAN_VERTICAL_PORTS-20}"
      GMJFLOW_SCAN_HORIZONTAL_HOSTS: "${GMJFLOW_SCAN_HORIZONTAL_HOSTS-20}"
      GMJFLOW_SCAN_LOW_SLOW_UNIQUE: "${GMJFLOW_SCAN_LOW_SLOW_UNIQUE-10}"
      GMJFLOW_UDP_FLOOD_MIN_PACKETS: "${GMJFLOW_UDP_FLOOD_MIN_PACKETS-3000}"
      GMJFLOW_UDP_FLOOD_MIN_PPS: "${GMJFLOW_UDP_FLOOD_MIN_PPS-100}"
      GMJFLOW_UDP_FLOOD_MIN_BPS: "${GMJFLOW_UDP_FLOOD_MIN_BPS-1000000}"
      GMJFLOW_SYN_FLOOD_MIN_PACKETS: "${GMJFLOW_SYN_FLOOD_MIN_PACKETS-3000}"
      GMJFLOW_SYN_FLOOD_MIN_PPS: "${GMJFLOW_SYN_FLOOD_MIN_PPS-100}"
      GMJFLOW_SYN_FLOOD_MIN_BPS: "${GMJFLOW_SYN_FLOOD_MIN_BPS-1000000}"
      GMJFLOW_CARPET_MIN_HOSTS: "${GMJFLOW_CARPET_MIN_HOSTS-8}"
      GMJFLOW_CARPET_MIN_PACKETS: "${GMJFLOW_CARPET_MIN_PACKETS-3000}"
      GMJFLOW_CARPET_MIN_PPS: "${GMJFLOW_CARPET_MIN_PPS-200}"
      GMJFLOW_CARPET_MIN_BPS: "${GMJFLOW_CARPET_MIN_BPS-1000000}"
      GMJFLOW_CARPET_MAX_HOST_PPS: "${GMJFLOW_CARPET_MAX_HOST_PPS-100}"
      GMJFLOW_SSH_BRUTE_FORCE_MIN_ATTEMPTS: "${GMJFLOW_SSH_BRUTE_FORCE_MIN_ATTEMPTS-30}"
      GMJFLOW_SSH_BRUTE_FORCE_MIN_SECONDS: "${GMJFLOW_SSH_BRUTE_FORCE_MIN_SECONDS-30}"
      GMJFLOW_CAMPAIGN_DDOS_MIN_SOURCES: "${GMJFLOW_CAMPAIGN_DDOS_MIN_SOURCES-20}"
      GMJFLOW_CAMPAIGN_DDOS_MIN_PPS: "${GMJFLOW_CAMPAIGN_DDOS_MIN_PPS-200}"
      GMJFLOW_CAMPAIGN_DDOS_MIN_BPS: "${GMJFLOW_CAMPAIGN_DDOS_MIN_BPS-1000000}"
      GMJFLOW_THREAT_POLICY_AUTO_ENABLED: "${GMJFLOW_THREAT_POLICY_AUTO_ENABLED-false}"
      GMJFLOW_THREAT_POLICY_AUTO_KILL_SWITCH: "${GMJFLOW_THREAT_POLICY_AUTO_KILL_SWITCH-false}"
      GMJFLOW_THREAT_AI_SHADOW_ENABLED: "${GMJFLOW_THREAT_AI_SHADOW_ENABLED-false}"
      GMJFLOW_THREAT_POLICY_REQUIRE_GROQ: "${GMJFLOW_THREAT_POLICY_REQUIRE_GROQ-true}"
      GMJFLOW_THREAT_POLICY_MIN_GROQ_CONFIDENCE: "${GMJFLOW_THREAT_POLICY_MIN_GROQ_CONFIDENCE-0.75}"
      GMJFLOW_THREAT_POLICY_MIN_SCORE: "${GMJFLOW_THREAT_POLICY_MIN_SCORE-85}"
      GMJFLOW_THREAT_POLICY_MIN_CONFIDENCE: "${GMJFLOW_THREAT_POLICY_MIN_CONFIDENCE-0.80}"
      GMJFLOW_THREAT_POLICY_REQUIRE_RELEVANT_INTEL: "${GMJFLOW_THREAT_POLICY_REQUIRE_RELEVANT_INTEL-false}"
      GMJFLOW_THREAT_POLICY_MIN_EVIDENCE_SCORE: "${GMJFLOW_THREAT_POLICY_MIN_EVIDENCE_SCORE-75}"
      GMJFLOW_THREAT_POLICY_MAX_EVALUATIONS: "${GMJFLOW_THREAT_POLICY_MAX_EVALUATIONS-10}"
      GMJFLOW_THREAT_POLICY_TTL_SECONDS: "${GMJFLOW_THREAT_POLICY_TTL_SECONDS-900}"
      GMJFLOW_THREAT_POLICY_COOLDOWN_SECONDS: "${GMJFLOW_THREAT_POLICY_COOLDOWN_SECONDS-300}"
      GMJFLOW_THREAT_RESPONSE_PROFILE_ID: "${GMJFLOW_THREAT_RESPONSE_PROFILE_ID-}"
      GMJFLOW_THREAT_PROTECTED_RANGES: "${GMJFLOW_THREAT_PROTECTED_RANGES-}"
      GMJ_FLOW_DATA_STALE_AFTER_SECONDS: "${GMJ_FLOW_DATA_STALE_AFTER_SECONDS-90}"
      GMJ_FLOW_GRAFANA_TOKEN: "${GMJ_FLOW_GRAFANA_TOKEN-}"
      GMJ_FLOW_GRAFANA_PREVIOUS_TOKEN: "${GMJ_FLOW_GRAFANA_PREVIOUS_TOKEN-}"
      GMJ_FLOW_GRAFANA_SCOPES: "${GMJ_FLOW_GRAFANA_SCOPES-grafana:data:read,grafana:dashboard:export}"
      GMJ_FLOW_GRAFANA_RATE_LIMIT_PER_MINUTE: "${GMJ_FLOW_GRAFANA_RATE_LIMIT_PER_MINUTE-120}"
      GMJ_FLOW_GRAFANA_MAX_WINDOW_SECONDS: "${GMJ_FLOW_GRAFANA_MAX_WINDOW_SECONDS-604800}"
      AI_MITIGATION_ENABLED: "${AI_MITIGATION_ENABLED-false}"
      AI_PROVIDER: "${AI_PROVIDER-ollama}"
      AI_BASE_URL: "${AI_BASE_URL-http://gmj-flow-ollama:11434}"
      AI_MODEL_PROFILE: "${AI_MODEL_PROFILE-recommended}"
      AI_MODEL: "${AI_MODEL-qwen2.5:3b-instruct}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS-20}"
      AI_MAX_TOP_FLOWS: "${AI_MAX_TOP_FLOWS-30}"
      AI_MAX_CONTEXT_CHARS: "${AI_MAX_CONTEXT_CHARS-12000}"
      AI_NUM_PREDICT: "${AI_NUM_PREDICT-160}"
      AI_ALLOW_AUTO: "${AI_ALLOW_AUTO-false}"
      AI_REQUIRE_POLICY_VALIDATION: "${AI_REQUIRE_POLICY_VALIDATION-true}"
      PMACCT_STATE_DIR: "${PMACCT_STATE_DIR-/var/spool/pmacct/state}"
    ports:
      - "${BACKEND_PORT-8000}:8000"
    volumes:
      - ./data/backend:/app/data
      - ./:/app/runtime
      - pmacct_spool:/var/spool/pmacct:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/exabgp:/run/exabgp
    depends_on:
      clickhouse:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: gmj-flow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT-8080}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/dashboard-formatters.js:/usr/share/nginx/html/dashboard-formatters.js:ro
      - ./frontend/dashboard-charts.js:/usr/share/nginx/html/dashboard-charts.js:ro
      - ./frontend/dashboard-time-range.js:/usr/share/nginx/html/dashboard-time-range.js:ro
      - ./frontend/dashboard-visualizations.js:/usr/share/nginx/html/dashboard-visualizations.js:ro
      - ./frontend/dashboard-layout.js:/usr/share/nginx/html/dashboard-layout.js:ro
      - ./frontend/dashboard-resize.js:/usr/share/nginx/html/dashboard-resize.js:ro
      - ./frontend/dashboard-prefix-controls.js:/usr/share/nginx/html/dashboard-prefix-controls.js:ro
      - ./frontend/threat-intelligence.js:/usr/share/nginx/html/threat-intelligence.js:ro
      - ./frontend/threat-intelligence.css:/usr/share/nginx/html/threat-intelligence.css:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  pmacct:
    build:
      context: ./collector/pmacct
    container_name: gmj-flow-pmacct
    profiles:
      - single-collector
    ports:
      - "${NETFLOW_PORT-9995}:9995/udp"
    volumes:
      - pmacct_spool:/var/spool/pmacct
    restart: unless-stopped

  pmacct-parser:
    build:
      context: ./collector/pmacct
    container_name: gmj-flow-pmacct-parser
    profiles:
      - single-collector
    command: ["python3", "/opt/gmj-flow/parse_pmacct.py"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE-flowdb}
      PMACCT_SENSOR: "${PMACCT_SENSOR-mikrotik-lab}"
      PMACCT_EXPORTER_IP: "${PMACCT_EXPORTER_IP-192.168.0.157}"
      PMACCT_OUTPUT_FILE: "${PMACCT_OUTPUT_FILE-/var/spool/pmacct/nfacctd.csv}"
      PMACCT_OUTPUT_FORMAT: "${PMACCT_OUTPUT_FORMAT-csv}"
      PMACCT_CSV_DELIMITER: "${PMACCT_CSV_DELIMITER-,}"
      PMACCT_CSV_FIELDS: "${PMACCT_CSV_FIELDS-src_as,dst_as,in_iface,out_iface,src_host,dst_host,src_port,dst_port,tcpflags,proto,timestamp_start,packets,bytes}"
      PMACCT_SAMPLE_RATE: "${PMACCT_SAMPLE_RATE-1}"
      PMACCT_PARSER_BATCH_SIZE: "${PMACCT_PARSER_BATCH_SIZE-1000}"
      PMACCT_PARSER_FLUSH_SECONDS: "${PMACCT_PARSER_FLUSH_SECONDS-5}"
      PMACCT_STATE_DIR: "${PMACCT_STATE_DIR-/var/spool/pmacct/state}"
      PMACCT_PARSER_START_FROM_END_IF_NO_STATE: "${PMACCT_PARSER_START_FROM_END_IF_NO_STATE-true}"
      GMJFLOW_PMACCT_ROTATE_ENABLED: "${GMJFLOW_PMACCT_ROTATE_ENABLED-true}"
      GMJFLOW_PMACCT_ROTATE_MAX_MB: "${GMJFLOW_PMACCT_ROTATE_MAX_MB-100}"
      GMJFLOW_PMACCT_ROTATE_KEEP_DAYS: "${GMJFLOW_PMACCT_ROTATE_KEEP_DAYS-3}"
      GMJFLOW_PMACCT_ROTATE_COMPRESS: "${GMJFLOW_PMACCT_ROTATE_COMPRESS-true}"
      GMJFLOW_PMACCT_ROTATE_CHECK_SECONDS: "${GMJFLOW_PMACCT_ROTATE_CHECK_SECONDS-30}"
    volumes:
      - pmacct_spool:/var/spool/pmacct
    depends_on:
      clickhouse:
        condition: service_healthy
      pmacct:
        condition: service_started
    restart: unless-stopped

  collector:
    build:
      context: ./collector
    container_name: gmj-flow-collector
    restart: unless-stopped
    profiles:
      - tools
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE-flowdb}
      FAKE_FLOW_BATCH_SIZE: ${FAKE_FLOW_BATCH_SIZE-1000}
      FAKE_FLOW_INTERVAL_SECONDS: ${FAKE_FLOW_INTERVAL_SECONDS-5}
    depends_on:
      clickhouse:
        condition: service_healthy

  gmj-flow-ollama:
    image: ollama/ollama
    container_name: gmj-flow-ollama
    restart: unless-stopped
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  clickhouse_data:
  pmacct_spool:
  ollama:
