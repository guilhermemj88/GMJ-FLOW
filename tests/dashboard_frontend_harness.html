<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>GMJ-FLOW dashboard frontend harness</title>
  <script src="../frontend/dashboard-formatters.js"></script>
  <script src="../frontend/dashboard-charts.js"></script>
  <script src="../frontend/dashboard-time-range.js"></script>
  <script src="../frontend/dashboard-visualizations.js"></script>
  <script src="../frontend/dashboard-layout.js"></script>
  <script src="../frontend/dashboard-resize.js"></script>
</head>
<body>
  <div id="result" data-status="running">Executando</div>
  <div id="grid" style="display:grid;width:1212px;column-gap:12px;row-gap:12px">
    <article class="configurable-dashboard-widget" data-widget-id="1">
      <div class="widget-resize-badge"></div>
      <button data-widget-drag-handle type="button">Mover</button>
      <div class="widget-resize-handle" data-resize-handle="se"></div>
      <div class="widget-content scroll-container">
        <table><tbody><tr><td><a id="rankingLink" href="#asn">AS15169</a></td></tr></tbody></table>
      </div>
    </article>
  </div>
  <script>
    (async function runDashboardFrontendHarness() {
      const failures = [];
      const assertEqual = (actual, expected, label) => {
        if (actual !== expected) failures.push(`${label}: ${actual} !== ${expected}`);
      };
      const assert = (condition, label) => {
        if (!condition) failures.push(label);
      };
      const frontendResponse = await fetch('../frontend/index.html');
      const frontendSource = await frontendResponse.text();
       const parsedFrontend = new DOMParser().parseFromString(
         frontendSource,
         'text/html'
       );
       parsedFrontend.querySelectorAll('style').forEach(style => {
         document.head.appendChild(style.cloneNode(true));
       });
      parsedFrontend.querySelectorAll('script:not([src])').forEach(script => {
        try {
          new Function(script.textContent);
        } catch (error) {
          failures.push(`index inline syntax: ${error.message}`);
        }
      });
       const format = GMJDashboardFormatters;
       const timeRange = GMJDashboardTimeRange;
       const chartHelpers = GMJDashboardCharts;

       const wideLayout = chartHelpers.getWidgetResponsiveLayout(920, {
         chartRatio: 60
       });
       const mediumLayout = chartHelpers.getWidgetResponsiveLayout(720, {
         chartRatio: 60
       });
       const stackedLayout = chartHelpers.getWidgetResponsiveLayout(580, {
         chartRatio: 60
       });
       assertEqual(wideLayout.mode, 'wide', 'wide widget layout');
       assertEqual(wideLayout.chartRatio, 60, 'wide widget keeps configured 60/40 ratio');
       assertEqual(mediumLayout.mode, 'medium', 'medium widget layout');
       assertEqual(mediumLayout.chartRatio, 40, 'medium widget makes chart smaller');
       assertEqual(stackedLayout.mode, 'stacked', 'narrow widget layout');
       assertEqual(
         chartHelpers.getWidgetResponsiveLayout(750, {
           breakpoints: { stacked: 700, wide: 1000 }
         }).mode,
         'medium',
         'widget breakpoints are configurable'
       );

       const responsiveFixture = document.createElement('article');
       responsiveFixture.className = 'configurable-dashboard-widget';
       responsiveFixture.dataset.widgetId = 'responsive-test';
       responsiveFixture.dataset.gridW = '8';
       responsiveFixture.dataset.gridH = '7';
       responsiveFixture.style.cssText = 'position:absolute;left:-2000px;top:0;width:920px;height:360px';
       responsiveFixture.innerHTML = `
         <div class="panel p-3">
           <div class="configurable-dashboard-widget-body" style="height:320px">
             <div class="configurable-ranking-combined">
               <div class="configurable-dashboard-widget-chart"></div>
               <div class="configurable-ranking-table-pane">
                 <div class="table-wrap">
                   <table class="table configurable-ranking-table">
                     <colgroup>
                       <col class="ranking-col-position"><col class="ranking-col-item">
                       <col class="ranking-col-value"><col class="ranking-col-percent">
                       <col class="ranking-col-action">
                     </colgroup>
                     <thead><tr>
                       <th class="ranking-cell-position">#</th>
                       <th class="ranking-cell-item">Item</th>
                       <th class="ranking-cell-value">bps</th>
                       <th class="ranking-cell-percent">%</th>
                       <th class="ranking-cell-action">Ação</th>
                     </tr></thead>
                     <tbody><tr>
                       <td class="ranking-cell-position">1</td>
                       <td class="ranking-cell-item" title="Nome completo muito longo">Nome completo muito longo</td>
                       <td class="ranking-cell-value">1,25 Gbps</td>
                       <td class="ranking-cell-percent">52,1%</td>
                       <td class="ranking-cell-action">...</td>
                     </tr></tbody>
                   </table>
                 </div>
               </div>
             </div>
           </div>
         </div>`;
       document.body.appendChild(responsiveFixture);
       const responsiveBody = responsiveFixture.querySelector(
         '.configurable-dashboard-widget-body'
       );
       const responsiveCombined = responsiveFixture.querySelector(
         '.configurable-ranking-combined'
       );
       chartHelpers.applyWidgetResponsiveLayout(responsiveBody, 920, {
         chartRatio: 60
       });
       assertEqual(
         responsiveBody.dataset.responsiveLayout,
         'wide',
         'wide chart and table state'
       );
       assert(
         getComputedStyle(responsiveCombined).gridTemplateColumns.split(' ').length >= 2,
         'wide chart and table are side by side'
       );

       responsiveFixture.style.width = '720px';
       chartHelpers.applyWidgetResponsiveLayout(responsiveBody, 720, {
         chartRatio: 60
       });
       assertEqual(
         responsiveBody.style.getPropertyValue('--ranking-chart-ratio'),
         '40%',
         'medium CSS ratio is adaptive'
       );

       responsiveFixture.style.width = '580px';
       chartHelpers.applyWidgetResponsiveLayout(responsiveBody, 580, {
         chartRatio: 60
       });
       assertEqual(
         responsiveBody.dataset.responsiveLayout,
         'stacked',
         'orientation change applies stacked state'
       );
       assertEqual(
         getComputedStyle(responsiveCombined).gridTemplateColumns.split(' ').length,
         1,
         'narrow chart is above table'
       );

       responsiveFixture.style.width = '920px';
       chartHelpers.applyWidgetResponsiveLayout(responsiveBody, 920, {
         chartRatio: 60
       });
       assertEqual(
         responsiveBody.dataset.responsiveLayout,
         'wide',
         'orientation change restores side-by-side state'
       );
       assertEqual(responsiveFixture.dataset.gridW, '8', 'responsive state preserves saved width');
       assertEqual(responsiveFixture.dataset.gridH, '7', 'responsive state preserves saved height');

       responsiveFixture.style.width = '360px';
       chartHelpers.applyWidgetResponsiveLayout(responsiveBody, 360);
       assertEqual(
         getComputedStyle(
           responsiveFixture.querySelector('th.ranking-cell-position')
         ).display,
         'none',
         'tiny table hides position first'
       );
       assert(
         getComputedStyle(
           responsiveFixture.querySelector('th.ranking-cell-value')
         ).display !== 'none',
         'bps remains visible in tiny table'
       );
       responsiveFixture.querySelector('th.ranking-cell-value').textContent = 'pps';
       assert(
         getComputedStyle(
           responsiveFixture.querySelector('th.ranking-cell-value')
         ).display !== 'none',
         'pps remains visible in tiny table'
       );
       assert(
         getComputedStyle(
           responsiveFixture.querySelector('th.ranking-cell-percent')
         ).display !== 'none',
         'percent remains visible in tiny table'
       );
       assertEqual(
         getComputedStyle(
           responsiveFixture.querySelector('.configurable-ranking-table-pane .table-wrap')
         ).overflowX,
         'hidden',
         'ranking table has no horizontal overflow'
       );
       assert(
         ['hidden', 'clip'].includes(getComputedStyle(responsiveFixture).overflowX),
         'widget contains external horizontal overflow'
       );

       const wideLegend = chartHelpers.getResponsiveLegendLayout(920, 360, 'right');
       const narrowLegend = chartHelpers.getResponsiveLegendLayout(480, 260, 'top');
       assertEqual(wideLegend.position, 'top', 'wide legend moves to top');
       assertEqual(narrowLegend.position, 'bottom', 'narrow legend moves below chart');
       assertEqual(narrowLegend.type, 'scroll', 'narrow legend paginates');
       assert(
         narrowLegend.nameLimit < wideLegend.nameLimit,
         'narrow legend truncates labels more aggressively'
       );

       const wideDonut = chartHelpers.getResponsivePieGeometry(600, 360, {
         donut: true,
         legend: wideLegend
       });
       const narrowDonut = chartHelpers.getResponsivePieGeometry(260, 190, {
         donut: true,
         legend: narrowLegend
       });
       assert(
         narrowDonut.outerRadius < wideDonut.outerRadius,
         'donut radius shrinks with available space'
       );
       assertEqual(wideDonut.center[0], '50%', 'wide donut remains horizontally centered');
       assertEqual(narrowDonut.center[0], '50%', 'narrow donut remains horizontally centered');
       assert(
         Number.parseInt(narrowDonut.radius[1], 10) <= 56,
         'narrow donut radius prevents clipping'
       );

       let resizeRenderCount = 0;
       const debouncedResize = chartHelpers.debounce(() => {
         resizeRenderCount += 1;
       }, 20);
       for (let width = 350; width <= 950; width += 25) {
         chartHelpers.applyWidgetResponsiveLayout(responsiveBody, width);
         debouncedResize();
       }
       await new Promise(resolve => setTimeout(resolve, 50));
       assertEqual(resizeRenderCount, 1, 'continuous resize is debounced');
       responsiveFixture.remove();

      const brtLabel = timeRange.formatUtcTimestamp(
        '2026-07-29T11:55:00Z',
        'pt-BR'
      );
      assert(brtLabel.includes('08:55:00'), 'UTC instant is displayed with the Sao Paulo clock');
      assert(brtLabel.toUpperCase().includes('BRT'), 'Sao Paulo formatter labels BRT');

      for (const minutes of [15, 60, 1440, 10080]) {
        assertEqual(
          timeRange.buildRangeContext(String(minutes)).range_minutes,
          minutes,
          `relative range ${minutes}m`
        );
      }
      const customContext = timeRange.buildRangeContext('custom', {
        start: '2026-07-27T10:00:00Z',
        end: '2026-07-28T10:00:00Z',
        previous: '20'
      });
      assertEqual(customContext.range_minutes, 1440, 'custom range ignores stale previous');
      assertEqual(customContext.start, '2026-07-27T10:00:00Z', 'custom start is absolute UTC');
      assertEqual(customContext.end, '2026-07-28T10:00:00Z', 'custom end is absolute UTC');
      const hourCacheKey = timeRange.widgetCacheKey(1, 2, 'query', {
        range_minutes: 60,
        interval: 60,
        sensor_id: 7,
        interface_id: 9
      });
      const dayCacheKey = timeRange.widgetCacheKey(1, 2, 'query', {
        range_minutes: 1440,
        interval: 300,
        sensor_id: 7,
        interface_id: 9
      });
      assert(hourCacheKey !== dayCacheKey, 'cache is separated by range and interval');
      const requestGate = timeRange.createRequestGate();
      const oldHourRequest = requestGate.activate({ range_minutes: 60 });
      const hourAutoRefresh = requestGate.activate({ range_minutes: 60 });
      assertEqual(
        hourAutoRefresh.revision,
        oldHourRequest.revision,
        'auto refresh preserves current range revision'
      );
      const currentDayRequest = requestGate.activate({ range_minutes: 1440 });
      assert(
        !requestGate.isCurrent(oldHourRequest),
        'rapid 1h response is stale after switching to 24h'
      );
      assert(
        requestGate.isCurrent(currentDayRequest),
        '24h response remains current with auto refresh active'
      );

      assertEqual(format.formatBitsPerSecond(0), '0 bps', 'bps zero');
      assertEqual(format.formatBitsPerSecond(950), '950 bps', 'bps base');
      assertEqual(format.formatBitsPerSecond(12500), '12,5 Kbps', 'bps kilo');
      assertEqual(format.formatBitsPerSecond(45000000), '45 Mbps', 'bps mega');
      assertEqual(format.formatBitsPerSecond(45435545677.2), '45,44 Gbps', 'bps giga');
      assertEqual(format.formatPacketsPerSecond(850), '850 pps', 'pps base');
      assertEqual(format.formatPacketsPerSecond(8400), '8,4 Kpps', 'pps kilo');
      assertEqual(format.formatPacketsPerSecond(4350000), '4,35 Mpps', 'pps mega');
      assertEqual(format.formatBitsPerSecond(-12500), '-12,5 Kbps', 'negative');
      assertEqual(format.formatBitsPerSecond(null), '-', 'null');
      assertEqual(format.formatBitsPerSecond(Number.NaN), '-', 'NaN');
      assertEqual(format.formatBitsPerSecond(Number.POSITIVE_INFINITY), '-', 'Infinity');
      assertEqual(format.formatPercentage(12.345), '12,35%', 'percentage');
      assertEqual(format.formatCount(12500), '12,5 K', 'count');
      assertEqual(format.formatTableValue(4350000, 'packets_s'), '4,35 Mpps', 'table');

      const bpsScale = format.selectMetricScale(45e9, 'bps');
      assertEqual(bpsScale.divisor, 1e9, 'bps scale divisor');
      assertEqual(bpsScale.unit, 'Gbps', 'bps scale unit');
      assertEqual(format.formatAxisValue(0, 'bps', bpsScale), '0 Gbps', 'axis fixed scale');
      assertEqual(
        format.formatTooltipValue(45435545677.2, 'bps', bpsScale),
        '45,44 Gbps',
        'tooltip fixed scale'
      );
      const ppsScale = format.selectMetricScale(4.3e6, 'pps');
      assertEqual(ppsScale.divisor, 1e6, 'pps scale divisor');
      assertEqual(ppsScale.unit, 'Mpps', 'pps scale unit');

      const rankingPayload = {
        kind: 'ranking',
        metric: 'bps',
        calculation: 'current',
        items: [
          { key: 'AS64500', value: 80 },
          { key: 'AS64501', value: 20 }
        ]
      };
      const rankingDataset = GMJDashboardVisualizations.rankingDataset(rankingPayload);
      assertEqual(rankingDataset.items.length, 2, 'ranking canonical item count');
      assertEqual(rankingDataset.items[0].percent, 80, 'ranking percent calculated');
      assertEqual(rankingDataset.total, 100, 'ranking total calculated');
      const groupedRanking = GMJDashboardVisualizations.groupRankingItems(
        Array.from({ length: 12 }, (_, index) => ({
          key: `AS${64500 + index}`,
          label: `AS${64500 + index}`,
          value: 12 - index,
          percent: 100 / 12
        })),
        8
      );
      assertEqual(groupedRanking.length, 8, 'donut keeps configured slice limit');
      assertEqual(groupedRanking[7].label, 'Outros', 'donut groups remaining slices');
      assertEqual(
        groupedRanking[7].metadata.grouped_items,
        5,
        'others metadata keeps grouped count'
      );
      const baseWidget = {
        type: 'top_n',
        config: {
          dimension: 'src_asn',
          metric: 'bps',
          direction: 'both',
          visualization_kind: 'table'
        },
        filters: []
      };
      const tableSignature = GMJDashboardVisualizations.dataQuerySignature(baseWidget);
      const pieSignature = GMJDashboardVisualizations.dataQuerySignature({
        ...baseWidget,
        config: {
          ...baseWidget.config,
          visualization_kind: 'pie',
          legend_calculation: 'total',
          field_config: { defaults: { unit: 'bps' } }
        }
      });
      assertEqual(tableSignature, pieSignature, 'visual-only change keeps query signature');
      assertEqual(
        GMJDashboardVisualizations.calculatePoints(
          [{ value: 1 }, { value: null }],
          'last'
        ),
        null,
        'last preserves terminal null'
      );
      assertEqual(
        GMJDashboardVisualizations.calculatePoints(
          [{ value: 1 }, { value: null }],
          'last_not_null'
        ),
        1,
        'last not null is defensive'
      );
      const trafficPayload = {
        kind: 'timeseries',
        metric: 'bps',
        series: [
          {
            key: 'upload',
            name: 'Upload',
            direction: 'upload',
            points: [{ ts: '2026-07-28T10:00:00Z', value: 50 }]
          },
          {
            key: 'download',
            name: 'Download',
            direction: 'download',
            points: [{ ts: '2026-07-28T10:00:00Z', value: 100 }]
          }
        ]
      };
      const trafficSnapshot = JSON.stringify(trafficPayload);
      const trafficModel = GMJDashboardVisualizations.buildTrafficModel(
        trafficPayload,
        {
          traffic_orientation: 'split_zero',
          legend_calculation: 'last_not_null'
        },
        {}
      );
      assertEqual(trafficModel.series[0].points[0].value, -50, 'split zero upload visual negative');
      assertEqual(trafficModel.series[0].legend_value, 50, 'split zero legend absolute');
      assertEqual(trafficModel.y_min, -trafficModel.y_max, 'split zero symmetric axis');
      assertEqual(JSON.stringify(trafficPayload), trafficSnapshot, 'split zero does not mutate API payload');
      const partialLegendModel = GMJDashboardVisualizations.buildTrafficModel(
        {
          kind: 'timeseries',
          metric: 'bps',
          series: [{
            key: 'download',
            name: 'Download',
            direction: 'download',
            points: [
              { ts: '2026-07-28T10:00:00Z', value: 100, partial: false },
              { ts: '2026-07-28T10:01:00Z', value: 5, partial: true }
            ]
          }]
        },
        { legend_calculation: 'last_not_null' },
        {}
      );
      assertEqual(
        partialLegendModel.series[0].legend_value,
        100,
        'legend uses last complete bucket'
      );

      const directionSeries = GMJDashboardCharts.consolidateDirectionSeries([
        {
          direction: 'upload',
          points: [
            { ts: '2026-07-28T10:01:00Z', value: 2 },
            { ts: '2026-07-28T10:00:00Z', value: 1 }
          ]
        },
        {
          direction: 'download',
          points: [
            { ts: '2026-07-28T10:00:00Z', value: 3 },
            { ts: '2026-07-28T10:00:00Z', value: 4 }
          ]
        },
        {
          direction: 'download',
          points: [
            { ts: '2026-07-28T10:00:00Z', value: 2 }
          ]
        }
      ], 'bits_s');
      assertEqual(directionSeries.length, 2, 'direction series count');
      assertEqual(directionSeries[0].name, 'Total Upload', 'stable upload order');
      assertEqual(directionSeries[1].name, 'Total Download', 'stable download order');
      assertEqual(directionSeries[1].points.length, 1, 'unique direction timestamps');
      assertEqual(directionSeries[1].points[0].value, 6, 'duplicate timestamp consolidation');
      const nullDirection = GMJDashboardCharts.consolidateDirectionSeries([
        {
          direction: 'upload',
          points: [{ ts: '2026-07-28T10:00:00Z', value: null }]
        }
      ], 'bits_s');
      assertEqual(nullDirection[0].points[0].value, null, 'direction null is not zero');
      assertEqual(GMJDashboardCharts.getChartDensityMode(300, 220), 'compact', 'compact density');
      assertEqual(GMJDashboardCharts.getChartDensityMode(800, 450), 'detailed', 'detailed density');
      assertEqual(GMJDashboardCharts.getChartDensityMode(800, 450, 'sparse'), 'compact', 'configured sparse density');
      assertEqual(GMJDashboardCharts.getChartDensityMode(300, 220, 'dense'), 'detailed', 'configured dense density');
      const fakeChart = {
        offCount: 0,
        option: null,
        options: null,
        off() { this.offCount += 1; },
        setOption(option, options) {
          this.option = option;
          this.options = options;
        }
      };
      for (let refresh = 0; refresh < 20; refresh += 1) {
        GMJDashboardCharts.replaceChartOption(fakeChart, {
          series: [{ name: 'Total Upload' }, { name: 'Total Download' }]
        });
      }
      assertEqual(fakeChart.option.series.length, 2, '20 refreshes keep two series');
      assertEqual(fakeChart.offCount, 20, '20 refreshes clear old handlers');
      assert(fakeChart.options.notMerge, 'chart refresh is non-merging');

      assertEqual(
        GMJDashboardResize.pixelWidthToGridColumns(192, 90, 12),
        2,
        'pixel width snap'
      );
      assertEqual(
        GMJDashboardResize.pixelHeightToGridRows(108, 48, 12),
        2,
        'pixel height snap'
      );
      assertEqual(
        GMJDashboardResize.gridColumnsToPixelWidth(2, 90, 12),
        192,
        'grid width conversion'
      );
      assertEqual(
        GMJDashboardResize.gridRowsToPixelHeight(2, 48, 12),
        108,
        'grid height conversion'
      );
      const resizeSession = {
        item: { x: 0, w: 4, h: 4, min_w: 2, min_h: 2, max_w: 12, max_h: 12 },
        initialW: 4,
        initialH: 4,
        startX: 0,
        startY: 0,
        columnWidth: 90,
        columnGap: 12,
        columnFactor: 1,
        rowHeight: 48,
        rowGap: 12,
        constraints: { columns: 12, min_w: 2, min_h: 2, max_w: 12, max_h: 12 },
        lockWidth: false
      };
      const horizontal = GMJDashboardResize.pointerDeltaToGridSize(
        { ...resizeSession, direction: 'e' },
        204,
        120
      );
      assertEqual(horizontal.w, 6, 'right handle changes width');
      assertEqual(horizontal.h, 4, 'right handle preserves height');
      const vertical = GMJDashboardResize.pointerDeltaToGridSize(
        { ...resizeSession, direction: 's' },
        204,
        120
      );
      assertEqual(vertical.w, 4, 'bottom handle preserves width');
      assertEqual(vertical.h, 6, 'bottom handle changes height');
      const bounded = GMJDashboardResize.snapWidgetSize(
        { x: 10, w: 2, h: 3, min_w: 2, min_h: 2, max_w: 12, max_h: 8 },
        { w: 8.7, h: 1.2 },
        { columns: 12 }
      );
      assertEqual(bounded.w, 2, 'x plus w bound');
      assertEqual(bounded.h, 2, 'minimum height');
      assert(Number.isInteger(bounded.w) && Number.isInteger(bounded.h), 'integer snap');

      const grid = document.getElementById('grid');
      const article = grid.querySelector('article');
      const handle = grid.querySelector('[data-resize-handle]');
      const moveHandle = grid.querySelector('[data-widget-drag-handle]');
      const rankingLink = grid.querySelector('#rankingLink');
      const widget = {
        id: 1,
        grid: { x: 0, y: 0, w: 4, h: 4 },
        height_mode: 'fixed'
      };
      let layout = [
        { id: 1, x: 0, y: 0, w: 4, h: 4, min_w: 2, min_h: 2, max_w: 12, max_h: 12 },
        { id: 2, x: 0, y: 4, w: 4, h: 3, min_w: 2, min_h: 2, max_w: 12, max_h: 12 },
        { id: 3, x: 0, y: 7, w: 4, h: 3, min_w: 2, min_h: 2, max_w: 12, max_h: 12 }
      ];
      let persisted = 0;
      let persistAttempts = 0;
      let rolledBack = 0;
      let rejectNextPersist = false;
      let editable = true;
      let responsiveColumns = 12;
      const controller = GMJDashboardResize.createDashboardResizeController({
        grid,
        layoutEngine: GMJDashboardLayout,
        getResponsiveColumns: () => responsiveColumns,
        getLayout: () => layout.map(item => ({ ...item })),
        getWidget: id => id === 1 ? widget : null,
        getConstraints: () => ({ columns: 12, min_w: 2, min_h: 2, max_w: 12, max_h: 12 }),
        canResize: () => editable,
        onPreview: payload => {
          layout = payload.layout.map(item => ({ ...item }));
        },
        onPersist: async () => {
          persistAttempts += 1;
          if (rejectNextPersist) {
            rejectNextPersist = false;
            throw new Error('PATCH rejeitado');
          }
          persisted += 1;
        },
        onRollback: payload => {
          rolledBack += 1;
          layout = payload.layout.map(item => ({ ...item }));
        }
      });
      let movePersisted = 0;
      const moveController = GMJDashboardResize.createDashboardMoveController({
        grid,
        layoutEngine: GMJDashboardLayout,
        getResponsiveColumns: () => responsiveColumns,
        getLayout: () => layout.map(item => ({ ...item })),
        getWidget: id => id === 1 ? widget : null,
        canMove: () => editable,
        onPreview: payload => {
          layout = payload.layout.map(item => ({ ...item }));
        },
        onPersist: async () => {
          movePersisted += 1;
        },
        onRollback: payload => {
          layout = payload.layout.map(item => ({ ...item }));
        }
      });

      rankingLink.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true,
        cancelable: true,
        pointerId: 99,
        pointerType: 'mouse',
        button: 0,
        clientX: 0,
        clientY: 0
      }));
      assertEqual(
        moveController.activeSession,
        null,
        'link and table content do not start drag'
      );

      const pointer = (type, pointerId, x, y) => handle.dispatchEvent(
        new PointerEvent(type, {
          bubbles: true,
          cancelable: true,
          pointerId,
          pointerType: 'mouse',
          button: 0,
          clientX: x,
          clientY: y
        })
      );
      const movePointer = (type, pointerId, x, y) => moveHandle.dispatchEvent(
        new PointerEvent(type, {
          bubbles: true,
          cancelable: true,
          pointerId,
          pointerType: 'mouse',
          button: 0,
          clientX: x,
          clientY: y
        })
      );
      pointer('pointerdown', 7, 0, 0);
      pointer('pointermove', 7, 80, 40);
      pointer('pointermove', 7, 204, 120);
      pointer('pointermove', 7, 204, 120);
      pointer('pointerup', 7, 204, 120);
      await new Promise(resolve => setTimeout(resolve, 20));

      const afterResize = new Map(layout.map(item => [item.id, item]));
      assertEqual(persisted, 1, 'single persistence after many pointer moves');
      assertEqual(afterResize.get(1).w, 6, 'horizontal resize');
      assertEqual(afterResize.get(1).h, 6, 'vertical resize');
      assertEqual(afterResize.get(2).y, 6, 'push first collision');
      assertEqual(afterResize.get(3).y, 9, 'cascade push');
      assert(GMJDashboardLayout.validateLayout(layout).valid, 'valid layout after pointerup');
      assert(!article.classList.contains('is-resizing'), 'resize class removed');

      const compacted = GMJDashboardLayout.resizeItemAndPush(layout, 1, 6, 4);
      const compactedById = new Map(compacted.map(item => [item.id, item]));
      assertEqual(compactedById.get(2).y, 4, 'shrink compacts first widget below');
      assertEqual(compactedById.get(3).y, 7, 'shrink compacts cascade below');
      assert(GMJDashboardLayout.validateLayout(compacted).valid, 'valid layout after shrink');

      const beforeCancel = GMJDashboardLayout.layoutSignature(layout);
      pointer('pointerdown', 8, 0, 0);
      pointer('pointermove', 8, 102, 60);
      pointer('pointercancel', 8, 102, 60);
      await new Promise(resolve => setTimeout(resolve, 20));
      assertEqual(persisted, 1, 'pointercancel does not persist');
      assertEqual(rolledBack, 1, 'pointercancel rolls back');
      assertEqual(GMJDashboardLayout.layoutSignature(layout), beforeCancel, 'cancel restores layout');

      editable = false;
      pointer('pointerdown', 9, 0, 0);
      pointer('pointermove', 9, 204, 120);
      pointer('pointerup', 9, 204, 120);
      await new Promise(resolve => setTimeout(resolve, 10));
      assertEqual(persisted, 1, 'readonly does not resize');
      assertEqual(controller.activeSession, null, 'readonly creates no session');

      editable = true;
      responsiveColumns = 1;
      const mobileInitialWidth = new Map(layout.map(item => [item.id, item])).get(1).w;
      pointer('pointerdown', 10, 0, 0);
      pointer('pointermove', 10, 600, 60);
      pointer('pointerup', 10, 600, 60);
      await new Promise(resolve => setTimeout(resolve, 20));
      assertEqual(
        new Map(layout.map(item => [item.id, item])).get(1).w,
        mobileInitialWidth,
        'mobile preserves desktop width'
      );
      assertEqual(persisted, 2, 'mobile vertical resize persists once');

      const beforePatchError = GMJDashboardLayout.layoutSignature(layout);
      rejectNextPersist = true;
      pointer('pointerdown', 11, 0, 0);
      pointer('pointermove', 11, 102, 60);
      pointer('pointerup', 11, 102, 60);
      await new Promise(resolve => setTimeout(resolve, 20));
      assertEqual(persisted, 2, 'failed PATCH is not accepted');
      assertEqual(persistAttempts, 3, 'failed PATCH has one attempt');
      assertEqual(rolledBack, 2, 'failed PATCH rolls back');
      assertEqual(
        GMJDashboardLayout.layoutSignature(layout),
        beforePatchError,
        'failed PATCH restores layout'
      );

      responsiveColumns = 12;
      handle.focus();
      handle.dispatchEvent(new KeyboardEvent('keydown', {
        bubbles: true,
        cancelable: true,
        key: 'ArrowDown'
      }));
      handle.dispatchEvent(new KeyboardEvent('keydown', {
        bubbles: true,
        cancelable: true,
        key: 'Enter'
      }));
      await new Promise(resolve => setTimeout(resolve, 20));
      assertEqual(persisted, 3, 'keyboard Enter persists once');

      movePointer('pointerdown', 14, 0, 0);
      movePointer('pointerup', 14, 0, 0);
      await new Promise(resolve => setTimeout(resolve, 10));
      assertEqual(movePersisted, 0, 'simple click does not persist move');
      assertEqual(moveController.activeSession, null, 'simple click clears armed move');

      movePointer('pointerdown', 15, 0, 0);
      movePointer('pointermove', 15, 3, 0);
      movePointer('pointerup', 15, 3, 0);
      await new Promise(resolve => setTimeout(resolve, 10));
      assertEqual(movePersisted, 0, 'movement below threshold does not persist');
      assert(!article.classList.contains('is-dragging'), 'threshold does not add dragging class');

      const beforeLostCapture = GMJDashboardLayout.layoutSignature(layout);
      movePointer('pointerdown', 16, 0, 0);
      movePointer('pointermove', 16, 204, 0);
      movePointer('lostpointercapture', 16, 204, 0);
      await new Promise(resolve => setTimeout(resolve, 20));
      assertEqual(movePersisted, 0, 'lost pointer capture does not persist');
      assertEqual(
        GMJDashboardLayout.layoutSignature(layout),
        beforeLostCapture,
        'lost pointer capture rolls back'
      );

      movePointer('pointerdown', 13, 0, 0);
      movePointer('pointermove', 13, 204, 0);
      movePointer('pointerup', 13, 204, 0);
      await new Promise(resolve => setTimeout(resolve, 20));
      const afterMove = new Map(layout.map(item => [item.id, item]));
      assertEqual(afterMove.get(1).x, 2, 'pointer move snaps active widget');
      assertEqual(movePersisted, 1, 'pointer move persists once');
      assert(GMJDashboardLayout.validateLayout(layout).valid, 'move preview has no collisions');
      assert(!article.classList.contains('is-dragging'), 'move class removed');

      const upward = GMJDashboardLayout.resolveDropLayout([
        { id: 1, x: 0, y: 8, w: 4, h: 4 },
        { id: 2, x: 0, y: 4, w: 4, h: 4 }
      ], 1, 4, 0, { compact: false });
      const upwardById = new Map(upward.map(item => [item.id, item]));
      assertEqual(upwardById.get(1).y, 0, 'active widget moves upward into free slot');
      assertEqual(upwardById.get(2).y, 4, 'passive widget keeps slot without compaction');

      moveController.destroy();
      controller.destroy();
      pointer('pointerdown', 12, 0, 0);
      pointer('pointermove', 12, 204, 120);
      pointer('pointerup', 12, 204, 120);
      await new Promise(resolve => setTimeout(resolve, 10));
      assertEqual(persisted, 3, 'destroy releases listeners');

      const result = document.getElementById('result');
      result.dataset.status = failures.length ? 'failed' : 'passed';
      result.textContent = failures.length ? failures.join(' | ') : 'DASHBOARD_FRONTEND_TESTS_OK';
    })().catch(error => {
      const result = document.getElementById('result');
      result.dataset.status = 'failed';
      result.textContent = `${error.name}: ${error.message}`;
    });
  </script>
</body>
</html>
